# Reachy Mini — SHIPPED default behavior rules (read-only package resource).
#
# This file is the LOWER of the two rule layers. It ships inside the wheel and
# is never written to on a robot. The UPPER layer is the box-local overlay at
# `<state_dir>/behavior/rules.toml` (see `reachy.behavior.rules
# .default_rules_path`), which an operator owns and tunes.
#
# How the two combine (see `reachy.behavior.rules.merge_rules`):
#
#   * precedence is per RULE ID — a box-local entry whose `id` matches an entry
#     here REPLACES it wholesale (never a field-by-field merge), keeping this
#     file's ordering position;
#   * an id present only here stays in force, so a box that upgrades gains
#     newly shipped rules WITHOUT losing its own tuning;
#   * an id present only in the overlay is appended, untouched;
#   * a box-local entry carrying `enabled = false` DISABLES the shipped rule of
#     that id (a tombstone — `id` is the only field it needs).
#
# Editing THIS file on a robot has no lasting effect: the next upgrade replaces
# it. Put every box-local change in the overlay instead.
#
# ===========================================================================
# What ships here, and why it is only three rules
# ===========================================================================
#
# These rules run on EVERY deployed robot with no operator-authored config at
# all, so the bar is "obviously correct in an arbitrary room", not "impressive
# in a demo". A robot that twitches at everything is worse than one that does
# three things well, so the shipped set is deliberately small: it acknowledges
# TOUCH, it turns toward SOUND, and it answers when it is ADDRESSED. Anything
# more speculative belongs in an operator's overlay, where the person who has
# to live with it can tune or tombstone it.
#
# THE RULE IDS BELOW ARE A PUBLIC INTERFACE. An operator overrides or disables
# a shipped rule *by id*, so renaming one silently orphans every box-local
# override of it. `tests/test_behavior_default_rules.py` pins the id list for
# exactly that reason — a rename must be a deliberate, visible edit.
#
# CORROBORATION (c32). No rule here keys on bare `speech`. Measured on the
# deployed robot in a quiet room with nobody speaking, `speech_detected` read
# true 45.8 % of the time (55/120 samples) while the bearing wandered across
# essentially the full acoustic range — see
# `docs/verification/2026-07-20-retire-old-flow-baseline.md` section 2. A rule
# on that flag fires on roughly a coin flip, pointed at nothing.
#
# A rule carries exactly ONE `when` predicate — the schema has no conjunction —
# so "corroborated" cannot mean ANDing two predicates together. It means keying
# on a field that is corroborated IN ITSELF, and each rule below does that a
# different way: `pat` is a physical proprioceptive measurement, `rms` is
# measured mic energy (and is handed to a behavior whose own gate corroborates
# it further), and `transcript` is an utterance that already cleared the
# layered engagement gate.

# --------------------------------------------------------------------------- #
# TOUCH — the least ambiguous input the robot has                             #
# --------------------------------------------------------------------------- #
#
# A pat is deliberate, physical, and impossible to trigger by accident from
# across the room, which makes it the one reaction that is safe to ship at full
# confidence. `pet-reaction` is self-completing with a finite outer backstop
# (`library.LIBRARY["pet-reaction"].default_duration`), so it needs no
# `duration_s` of its own.
#
# The id is `pat-acknowledge` because that name is ALREADY the deployed one:
# the repository fixtures (`docs/fixtures/behavior-rules/`), the operating
# guide, and the box's own overlay all use it. Shipping under any other name
# would leave a robot running this rule AND its box-local twin at once.
[[react]]
id = "pat-acknowledge"
when = { field = "pat", op = "is_true" }
run = "pet-reaction"
cooldown_s = 5.0

# --------------------------------------------------------------------------- #
# SOUND — turn toward it, on energy measured RELATIVE to the room             #
# --------------------------------------------------------------------------- #
#
# Keyed on loudness, not `speech`: loudness is a physical measurement of the
# mic, so it works on a bare box with nothing else installed and no external
# service reachable — which is exactly the fresh-install case these defaults
# exist for. (`transcript` would be the stronger signal, but it needs a
# reachable STT service; a default that silently does nothing without one is
# not a default.)
#
# It keys on `rms_ratio`, NOT the raw `rms`, and that distinction is the whole
# of issue #102. This rule used to read `rms >= 0.02` — one absolute number,
# calibrated in one room. Measured on the deployed robot over 24 h
# (`docs/verification/2026-07-21-live-verification-night.md` section 4) the mic
# background drifts ~25x across conditions the SAME robot lives in:
#
#   daytime baseline .......................  p50 0.004   ->   0 % over 0.02
#   night, no streaming ....................  p50 0.0207  ->  51.7 % over 0.02
#   night, 50 Hz streaming (the normal one).  p50 0.034   ->  99.1 % over 0.02
#   post-motion settle, 0-4 s ..............  p50 0.07-0.13 -> 100 % over 0.02
#
# So 0.02 sat UNDER the night background — every empty-room "fire" the operator
# saw was the background, honestly reported — while any number above the night
# state deafens the daytime robot. No absolute value is right in both rooms.
# `rms_ratio` is this tick's loudness over a rolling median of the room's own
# background (`reachy/behavior/rms_background.py`), so "loud" is a comparison
# again: 5x the room, whatever the room happens to be.
#
# The `value` below is `OrientParams.rms_ratio` — the same number
# `orient-to-sound`'s OWN admission gate uses, itself `SnapDetector`'s default
# ratio (the companion the old 0.02 was originally separated FROM). Stating it
# once here means the rule never admits a behavior whose gate would immediately
# close again; `tests/test_behavior_default_rules.py` pins the two together so
# the copy in this file cannot drift from the behavior's default. At the
# measured daytime background the arithmetic is unchanged from what shipped:
# 5 x 0.004 = 0.020.
#
# The other half of the tunable pair — the WINDOW the background is estimated
# over — is `OrientParams.rms_background_s` (10 s), overridable at composition
# with `REACHY_RMS_BACKGROUND_S`. A shorter window tracks a drifting room
# faster and is more easily dominated by one utterance; a longer one is steadier
# and slower to notice a genuinely new room.
#
# Admission is cheap even when it is wrong: with no credible sound
# `orient-to-sound` ABSTAINS rather than freezing, so `feel-alive` keeps
# breathing through it and the head never moves. The behavior's own graded
# ladder (`CorroboratedGate` + `LatchedDoaGuard`) decides whether anything
# actually turns — antenna lean, a bounded head nudge, or the deliberate turn.
#
# And that ladder is graded by COST, not just by evidence. This rule's `value`
# admits TIER 1 — the antenna lean. TIER 2, the head/body turn, needs one more
# thing: sound that is LOUD relative to the room (`rms_ratio_loud`, 15x) or
# ONGOING (`sustain_s`, 1.5 s). The reason is measured, and it is not about
# taste: in an ordinary room this rule fired 203 times in 8 minutes, and in the
# same session the pat sense recorded ZERO detections in 5 minutes — the pat
# sense suspends while another behavior owns the head, so a head that keeps
# turning is a head that can never feel a pat. Making tier 2 rare is what makes
# touch work.
#
# All three knobs are tunable here, per rule, e.g.
#
#   params = { rms_ratio = 6.0, rms_ratio_loud = 20.0, sustain_s = 2.0 }
#
# or on a deployed box via `REACHY_ORIENT_RMS_RATIO` /
# `REACHY_ORIENT_RMS_RATIO_LOUD` / `REACHY_ORIENT_SUSTAIN_S` (a systemd drop-in,
# no file edit). A `params` entry here always wins over the environment.
#
# `duration_s = 12` is derived, not chosen by feel: a full cycle is at most
# `max_dur` (4 s) turning + `hold` (3 s) + `recenter_after` (4 s) easing home =
# 11 s, plus a second of margin. Cutting the window shorter would evict the
# behavior mid-turn and SNAP the head back to base presence; longer would keep
# a non-base behavior on the head for no reason, and the pat sense's stillness
# gate stays shut while the head is being driven.
[[react]]
id = "look-toward-sound"
when = { field = "rms_ratio", op = "ge", value = 5.0 }
run = "orient-to-sound"
duration_s = 12.0
cooldown_s = 2.0

# --------------------------------------------------------------------------- #
# WORDS — acknowledge being addressed, once, and then stop                    #
# --------------------------------------------------------------------------- #
#
# `transcript` is the strongest corroboration in the runtime: an utterance only
# reaches this field after clearing the layered engagement gate (fuzzy name
# match, else a single-shot LLM "was this addressed to the robot?" judgement),
# so this cannot fire on ambient human-to-human chatter.
#
# `run = "speak"` + `say = "..."` is the sanctioned pairing — the visible and
# audible halves of one reaction. The words are rendered off the tick thread by
# `SpeechActuator`, whose default voice is the in-process, offline `harmonic`
# engine, so this speaks on a box with nothing reachable.
#
# This is an ACKNOWLEDGEMENT ("I heard you"), not an answer — answering is the
# cognition layer's job. So it is deliberately terse, and `cooldown_s` matches
# the orienting window above: at most one acknowledgement per engagement, and a
# continuing conversation gets silence rather than a chirp per sentence.
#
# It is a SEPARATE rule from the two above on purpose. Rule ids are the
# override surface, so folding the voice into `pat-acknowledge` would deny an
# operator the ability to mute the robot without also losing its pat reaction.
[[react]]
id = "greet-when-addressed"
when = { field = "transcript", op = "is_true" }
run = "speak"
duration_s = 1.6
cooldown_s = 12.0
say = "I'm here."
